<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>FCV Denderleeuw TV</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ical.js/1.5.0/ical.min.js"></script>
    <style>
        :root { --dender-blauw: #0055a4; --dender-zwart: #121212; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--dender-zwart); color: white; margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        .container { display: grid; grid-template-columns: 65% 35%; flex-grow: 1; padding: 20px; gap: 20px; }
        
        /* Programma */
        .main-panel { background: rgba(255,255,255,0.05); padding: 25px; border-radius: 15px; border-top: 8px solid var(--dender-blauw); }
        h1 { margin-top: 0; font-size: 2.5rem; text-transform: uppercase; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .event-card { background: #1e1e1e; margin-bottom: 10px; padding: 15px; border-radius: 8px; display: flex; align-items: center; border-left: 5px solid var(--dender-blauw); }
        .time { color: #f1c40f; font-weight: bold; font-size: 1.5rem; min-width: 90px; }
        .team { font-size: 1.4rem; flex-grow: 1; padding-left: 20px; }
        .loc { background: var(--dender-blauw); padding: 5px 15px; border-radius: 4px; font-weight: bold; }

        /* Zijpaneel */
        .side-panel { display: flex; flex-direction: column; gap: 20px; }
        .box { background: #1e1e1e; padding: 20px; border-radius: 15px; text-align: center; }
        #clock { font-size: 4.5rem; font-weight: bold; line-height: 1; }
        #date { color: #888; font-size: 1.2rem; margin-top: 10px; text-transform: capitalize; }
        
        /* Weer: iframe methode is betrouwbaarder voor GitHub */
        .weather-container { height: 250px; border-radius: 15px; overflow: hidden; background: #fff; }

        /* Sponsoren */
        .sponsor-footer { background: white; color: black; padding: 15px; font-size: 1.8rem; font-weight: bold; white-space: nowrap; overflow: hidden; border-top: 6px solid var(--dender-blauw); }
        .marquee { display: inline-block; animation: scroll 25s linear infinite; padding-left: 100%; }
        @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-100%); } }
    </style>
</head>
<body>

    <div class="container">
        <div class="main-panel">
            <h1>Programma Vandaag</h1>
            <div id="events-container">Agenda aan het ophalen...</div>
        </div>

        <div class="side-panel">
            <div class="box">
                <div id="clock">00:00</div>
                <div id="date">Datum laden...</div>
            </div>

            <div class="box" style="padding:0; overflow:hidden; height:260px;">
                <iframe src="https://gadgets.buienradar.nl/gadget/zoommap/?lat=50.89&lng=4.07&overname=2&zoom=8&naam=denderleeuw&size=2&voorpseld=1" scrolling="no" width="100%" height="260" frameborder="no"></iframe>
            </div>

            <div class="box" style="flex-grow: 1; text-align: left;">
                <h3 style="color: var(--dender-blauw); margin:0 0 10px 0;">MEDEDELINGEN</h3>
                <p>• Welkom bij FCV Denderleeuw</p>
                <p>• Respecteer de kleedkamers</p>
            </div>
        </div>
    </div>

    <div class="sponsor-footer">
        <div class="marquee">
            SPONSOR: CAFE DE SPORTWERELD &nbsp;&nbsp;&nbsp; • &nbsp;&nbsp;&nbsp; SLAGERIJ BART & ANN &nbsp;&nbsp;&nbsp; • &nbsp;&nbsp;&nbsp; GARAGE DENDERLEEUW &nbsp;&nbsp;&nbsp; • &nbsp;&nbsp;&nbsp; BEDANKT VOOR UW STEUN!
        </div>
    </div>

    <script>
        function updateClock() {
            const nu = new Date();
            document.getElementById('clock').textContent = nu.toLocaleTimeString('nl-BE', {hour: '2-digit', minute:'2-digit'});
            document.getElementById('date').textContent = nu.toLocaleDateString('nl-BE', {weekday: 'long', day: 'numeric', month: 'long'});
        }
        setInterval(updateClock, 1000); updateClock();

        // We gebruiken een publieke proxy om de PSD link te kunnen lezen
        const psdUrl = 'https://denderleeuw.prosoccerdata.com/api/v2/members/ics/file?id=943&uuid=11ffb49b-2197-11ea-8e99-5e16215dd2d6';
        const proxy = 'https://api.allorigins.win/get?url=' + encodeURIComponent(psdUrl);

        async function loadCalendar() {
            try {
                const response = await fetch(proxy);
                const json = await response.json();
                const jcalData = ICAL.parse(json.contents);
                const comp = new ICAL.Component(jcalData);
                const vevents = comp.getAllSubcomponents('vevent');
                
                const container = document.getElementById('events-container');
                container.innerHTML = '';
                
                const todayStr = new Date().toDateString();
                let count = 0;

                vevents.forEach(vevent => {
                    const event = new ICAL.Event(vevent);
                    if(event.startDate.toJSDate().toDateString() === todayStr) {
                        count++;
                        const time = event.startDate.toJSDate().toLocaleTimeString('nl-BE', {hour:'2-digit', minute:'2-digit'});
                        container.innerHTML += `
                            <div class="event-card">
                                <div class="time">${time}</div>
                                <div class="team">${event.summary}</div>
                                <div class="loc">${event.location || 'TBD'}</div>
                            </div>
                        `;
                    }
                });

                if(count === 0) container.innerHTML = "<h3>Geen activiteiten voor vandaag.</h3>";
            } catch (e) {
                console.error(e);
                document.getElementById('events-container').innerHTML = "Agenda momenteel niet beschikbaar.";
            }
        }
        loadCalendar();
        setInterval(loadCalendar, 600000); // Elke 10 min verversen
    </script>
</body>
</html>
